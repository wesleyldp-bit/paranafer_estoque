<!-- SCRIPT DE CONEXÃO E LÓGICA -->
    <script>
        const urlGoogleScript = 'https://script.google.com/macros/s/AKfycbxaVEbo0ba6bDgFG2j_MkOr9mFsntyf40UvQGo8ArP0DxrTIIOSUAduPDlfYm4rI1A/exec';

        let dadosGlobais = [];

        // Mapeamento rigoroso e limpo de acordo com a planilha real
        function obterDestinosProduto(nomeProduto) {
            const p = (nomeProduto || '').trim().toUpperCase();
            
            const mapa = {
                'EQ45':        { rp: 600,   cas: 0, gua: 0,    ara: 700,  lon: 0 },
                'EQ92':        { rp: 0,     cas: 0, gua: 0,    ara: 500,  lon: 0 },
                'EQ138':       { rp: 0,     cas: 0, gua: 0,    ara: 1000, lon: 0 },
                'Q61':         { rp: 200,   cas: 0, gua: 0,    ara: 0,    lon: 0 },
                'Q92':         { rp: 300,   cas: 0, gua: 0,    ara: 0,    lon: 0 },
                'H6SLE':       { rp: 240,   cas: 0, gua: 0,    ara: 0,    lon: 0 },
                'H8N 12 MTS':  { rp: 600,   cas: 0, gua: 0,    ara: 0,    lon: 0 },
                'H12 12 MTS':  { rp: 100,   cas: 0, gua: 500,  ara: 0,    lon: 0 },
                '4,2 RL 2TON': { rp: 0,     cas: 0, gua: 7000, ara: 0,    lon: 0 },
                '5,0 BARRA':   { rp: 12000, cas: 0, gua: 8000, ara: 0,    lon: 0 }
            };

            if (mapa[p]) return mapa[p];
            return { rp: 0, cas: 0, gua: 0, ara: 0, lon: 0 };
        }

        async function carregarDadosCargas() {
            const badge = document.getElementById('syncBadge');
            badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> A sincronizar...';

            try {
                const response = await fetch(urlGoogleScript);
                const data = await response.json();
                
                let listaProdutos = [];
                let ultimaMod = "Desconhecida";

                if (Array.isArray(data)) {
                    listaProdutos = data;
                } else if (data && Array.isArray(data.dados)) {
                    listaProdutos = data.dados;
                    ultimaMod = data.ultimaAtualizacao || "Recente";
                } else if (data && Array.isArray(data.produtos)) {
                    listaProdutos = data.produtos;
                }

                if (listaProdutos && listaProdutos.length > 0) {
                    dadosGlobais = listaProdutos;
                    
                    if (listaProdutos[0] && listaProdutos[0].UltimaAtualizacaoPlanilha) {
                        ultimaMod = listaProdutos[0].UltimaAtualizacaoPlanilha;
                    }

                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Atualizado no Sheets em: ${ultimaMod}`;

                    processarEExibirCargas(dadosGlobais);
                } else {
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> Sem dados encontrados';
                }
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> Erro de Conexão';
            }
        }

        function processarEExibirCargas(lista) {
            const comCargas = lista.filter(item => (Number(item.Agendado) || 0) > 0);

            let tRio = 0, tCasc = 0, tGuara = 0, tArap = 0, tLond = 0;

            comCargas.forEach(item => {
                let dest = obterDestinosProduto(item.Produto);
                tRio += dest.rp;
                tCasc += dest.cas;
                tGuara += dest.gua;
                tArap += dest.ara;
                tLond += dest.lon;
            });

            // Atualiza os cartões de topo com os totais corretos recalculados
            document.getElementById('totalRioPreto').innerText = tRio.toLocaleString('pt-BR') + ' pç';
            document.getElementById('totalCascavel').innerText = tCasc.toLocaleString('pt-BR') + ' pç';
            document.getElementById('totalGuarapu').innerText = tGuara.toLocaleString('pt-BR') + ' pç';
            document.getElementById('totalArapongas').innerText = tArap.toLocaleString('pt-BR') + ' pç';
            document.getElementById('totalLondrina').innerText = tLond.toLocaleString('pt-BR') + ' pç';

            renderTabelaCargas(comCargas);
        }

        function renderTabelaCargas(lista) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!lista || lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-400">Nenhuma carga agendada encontrada.</td></tr>`;
                document.getElementById('contadorResultados').innerText = `0 registos encontrados`;
                return;
            }

            let somaTotalGeral = 0;

            lista.forEach(item => {
                let dest = obterDestinosProduto(item.Produto);
                let agendadoGeral = Number(item.Agendado) || 0;
                let totalItem = dest.rp + dest.cas + dest.gua + dest.ara + dest.lon;
                if(totalItem === 0) totalItem = agendadoGeral;

                somaTotalGeral += totalItem;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/50 border-b border-slate-800 transition-colors">
                        <td class="p-3 text-slate-400">${item.Familia || '-'}</td>
                        <td class="p-3 font-semibold text-white">${item.Produto || '-'}</td>
                        <td class="p-3 text-center font-mono ${dest.rp > 0 ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${dest.rp > 0 ? dest.rp.toLocaleString('pt-BR') : '-'}</td>
                        <td class="p-3 text-center font-mono ${dest.cas > 0 ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${dest.cas > 0 ? dest.cas.toLocaleString('pt-BR') : '-'}</td>
                        <td class="p-3 text-center font-mono ${dest.gua > 0 ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${dest.gua > 0 ? dest.gua.toLocaleString('pt-BR') : '-'}</td>
                        <td class="p-3 text-center font-mono ${dest.ara > 0 ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${dest.ara > 0 ? dest.ara.toLocaleString('pt-BR') : '-'}</td>
                        <td class="p-3 text-center font-mono ${dest.lon > 0 ? 'text-cyan-400 font-bold' : 'text-slate-600'}">${dest.lon > 0 ? dest.lon.toLocaleString('pt-BR') : '-'}</td>
                        <td class="p-3 text-right font-mono font-bold text-emerald-400">${totalItem.toLocaleString('pt-BR')} pç</td>
                    </tr>
                `;
            });

            document.getElementById('contadorResultados').innerText = `Exibindo ${lista.length} produtos com agendamento (Total Geral: ${somaTotalGeral.toLocaleString('pt-BR')} pç)`;
        }

        function filtrarTabela() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = dadosGlobais.filter(item => {
                const agendado = Number(item.Agendado) || 0;
                if (agendado <= 0) return false;

                const prod = (item.Produto || '').toLowerCase();
                const fam = (item.Familia || '').toLowerCase();
                return prod.includes(termo) || fam.includes(termo);
            });
            renderTabelaCargas(filtrados);
        }

        window.addEventListener('DOMContentLoaded', carregarDadosCargas);
    </script>
